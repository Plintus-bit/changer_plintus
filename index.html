<!DOCTYPE html>
<html>
  <head>
    <link rel="icon" href="https://s3.twcstorage.ru/plintus-084237/success.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>COPYCAT</title>
    
    <style>
        * {
            padding: 0;
            margin: 0;
            border: none;
            text-decoration: none;
            cursor: auto;
            position: relative;
            z-index: 0;
        }

        body {
            width: 100%;
            height: 100vh;

            overflow: hidden;
        }

        /* стили проекта */
        #main {
            width: 100%;
            height: inherit;

            background-color: #7e8386;
        }

        #settings {
            display: none;
        }

        #data {
            display: grid;

            grid-template-columns: 100%;
            gap: 2em;

            justify-items: center;

            padding: 1em 1em;
        }

        #input-place {
            display: grid;
            height: 30em;
            grid-template-columns: 100%;
            grid-auto-rows: 1.5em;
            gap: 1.3em;

            background-color: #94989e;
            border-radius: 1em;
            padding: 1em 1em;
            overflow-y: scroll;

            justify-items: center;
        }
        #input-place::-webkit-scrollbar {
            width: 10px;
            background-color: #a5abb3;
            border-radius: 0em 1em 1em 0em;
        }
        #input-place::-webkit-scrollbar-thumb {
            background-color: #bbc1c9;
        }

        input.data {
            width: 40em;
            height: 1.5em;

            padding: 0.5em 1em;
            border-radius: 0.5em;
        }

        button {
            cursor: pointer;

            padding: 1em 3em;
            border-radius: 3em;
            background-color: #c191ee;
            transition: 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        button.disabled {
            background-color: #a5abb3;
        }
        button:hover {
            filter: brightness(1.2);
        }
        button:active {
            transform: scale(0.96);
        }

        .disabled {
            pointer-events: none;
        }

        audio {
            position: fixed;
            right: 30px;
            top: 150px;
            z-index: 2;
            height: 30px;
            width: 300px;
            visibility: hidden;
            display: none;
        }

    </style>
  </head>
  <body>
    <audio preload id="antifreeze" src="https://s3.twcstorage.ru/plintus-084237/sounds/silence.mp3" loop></audio>
    
    <!-- <audio preload id="notify-sound-success" src="https://s3.twcstorage.ru/plintus-084237/sounds/done_3.1.mp3"></audio> -->
    <audio preload id="notify-sound-success" src="https://s3.twcstorage.ru/plintus-084237/sounds/hedgehog.mp3"></audio>
    <!-- <audio preload id="notify-sound-warning" src="https://s3.twcstorage.ru/plintus-084237/sounds/warning_3.1.mp3"></audio> -->
    <audio preload id="notify-sound-warning" src="https://s3.twcstorage.ru/plintus-084237/sounds/gta-san-andreas-ah-shit-here-we-go-again.mp3"></audio>
    <audio preload id="notify-sound-wrong" src="https://s3.twcstorage.ru/plintus-084237/sounds/fail_3.1.mp3"></audio>

    <section id="main">
        <section id="settings">

        </section>

        <section id="data">
            <section id="input-place"></section>
            <button id="send" class="need-block-on-script" onclick="ScriptSenderSupport.Send()">Начать работу скрипта</button>
            <button id="clear-attemps" onclick="ScriptSenderSupport.ClearAttempts()">Обнулить счётчик попыток (попыток сделано: <span>0</span>)</button>
            <button id="new-round" class="need-block-on-script" onclick="ScriptSenderSupport.NewRound()">Закончить попытки</button>
            <button id="stop" onclick="ScriptSenderSupport.Stop()">Остановить работу</button>
        </section>


    </section>


    <script>
    //   логика проекта

    class SoundData {
        static ok = new SoundData(document.getElementById("notify-sound-success"), 5000);
        static wrong = new SoundData(document.getElementById("notify-sound-wrong"), 2000);
        static warning = new SoundData(document.getElementById("notify-sound-warning"), 4000);

        constructor(item, time=1000) {
            this.item = item;
            this.time = time;
        }

        static GetSoundByType(statusType) {
            if (statusType == st_ok) return SoundData.ok;
            if (statusType == st_wrong) return SoundData.wrong;
            if (statusType == st_warn) return SoundData.warning;
        }
    }
    
    class NotifySound {
        static notify = null;
        static isPlay = false;
        static timeoutID = null;

        static ChangeVolume(newVol) {
            SoundData.ok.item.volume = newVol;
            SoundData.warning.item.volume = newVol;
            SoundData.wrong.item.volume = newVol;
        }

        static Play(soundData) {
            if (NotifySound.isPlay) {
                clearTimeout(NotifySound.timeoutID);
                NotifySound.timeoutID = null;
                if (NotifySound.notify) {
                    NotifySound.notify.load();
                }
                NotifySound.notify = null;
            }
            NotifySound.notify = soundData.item;
            NotifySound.notify.play();
            NotifySound.isPlay = true;
            NotifySound.timeoutID = setTimeout(NotifySound.Pause, soundData.time);
        }
        static Pause() {
            if (NotifySound.isPlay) {
                if (NotifySound.notify) {
                    NotifySound.notify.load();
                }
                NotifySound.notify = null;
                NotifySound.isPlay = false;
            }
        }
    }

    class ScriptSenderSupport {
        static antifreeze = document.getElementById("antifreeze");

        static attempts = 0;
        static maxAutoAttempts = 3;
        
        static btnAttempsCounter = document.getElementById("clear-attemps");

        static LockClass(classname) {
            var need_block = document.getElementsByClassName(classname);
            for (var i = 0; i < need_block.length; ++i) {
                if (!(need_block[i].classList.contains("disabled"))) {
                    need_block[i].classList.add("disabled");
                    need_block[i].disabled = true;
                }
            }
        }
        static UnlockClass(classname) {
            var need_block = document.getElementsByClassName(classname);
            for (var i = 0; i < need_block.length; ++i) {
                if (need_block[i].classList.contains("disabled")) {
                    need_block[i].classList.remove("disabled");
                    need_block[i].disabled = false;
                }
            }
        }
        static LockID(ID) {
            const need_block = document.getElementById(ID);
            if (!(need_block.classList.contains("disabled"))) {
                need_block.classList.add("disabled");
                need_block.disabled = true;
            }
        }
        static UnlockID(ID) {
            const need_block = document.getElementById(ID);
            if (need_block.classList.contains("disabled")) {
                need_block.classList.remove("disabled");
                need_block.disabled = false;
            }
        }
        static Send() {
            const stringData = DataInputs.GetAllData();

            ScriptSenderSupport.LockClass("data");
            ScriptSenderSupport.LockClass("need-block-on-script");

            ScriptSenderSupport.antifreeze.play();

            google.script.run
                .withSuccessHandler(ScriptSenderSupport.OnSuccess)
                .withFailureHandler(ScriptSenderSupport.OnFailure)
                .MultiChange(DataInputs.GetAllData());
        }
        static OnSuccess(msg = "") {
            console.log(msg);
            
            NotifySound.ChangeVolume(0.4);

            ScriptSenderSupport.antifreeze.load();

            NotifySound.Play(SoundData.ok);

            ScriptSenderSupport.UnlockClass("data");
            ScriptSenderSupport.UnlockClass("need-block-on-script");

            DataInputs.ClearData();
            ScriptSenderSupport.ClearAttempts();
        }
        static OnFailure(msg = "") {
            console.log(msg);

            NotifySound.ChangeVolume(0.7);

            NotifySound.Play(SoundData.wrong);

            ScriptSenderSupport.attempts += 1;
            ScriptSenderSupport.btnAttempsCounter.children[0].innerHTML = ScriptSenderSupport.attempts;

            if (ScriptSenderSupport.attempts >= ScriptSenderSupport.maxAutoAttempts) {
                ScriptSenderSupport.UnlockClass("need-block-on-script");
                return;
            }
            else {
                setTimeout(ScriptSenderSupport.Resume, 2000);
            }
        }
        static Resume() {
            NotifySound.ChangeVolume(0.5);
            NotifySound.Play(SoundData.warning);

            setTimeout(() => {
                google.script.run
                    .withSuccessHandler(ScriptSenderSupport.OnSuccess)
                    .withFailureHandler(ScriptSenderSupport.OnFailure)
                    .MultiChange(DataInputs.GetAllData());
            }, 3000);
        }
        static NewRound() {
            ScriptSenderSupport.antifreeze.load();

            ScriptSenderSupport.ClearAttempts();

            ScriptSenderSupport.UnlockClass("data");
            ScriptSenderSupport.UnlockClass("need-block-on-script");

            DataInputs.ClearData();
        }
        static ClearAttempts() {
            ScriptSenderSupport.attempts = 0;
            ScriptSenderSupport.btnAttempsCounter.children[0].innerHTML = ScriptSenderSupport.attempts;
        }
        static Stop() {
            google.script.run
                    .withSuccessHandler(ScriptSenderSupport.OnSuccess)
                    .withFailureHandler(ScriptSenderSupport.OnFailure)
                    .StopSignal();
        }
    }

    
    class DataInputs {
        static dataPlace = document.getElementById("input-place");
        static dataTemplate = '<input type="url" name="data-url" class="data" data-id=0 placeholder="URL или ID">';

        static ClearData() {
            DataInputs.dataPlace.innerHTML = "";
            DataInputs.CreateDataInput();
        }
        static GetAllData() {
            const childs = DataInputs.dataPlace.children;
            var stringData = "";
            for (var i = childs.length - 2; i >= 0; i--) {
                stringData += childs[i].value + ";";
            }
            return stringData.slice(0, stringData.length - 1);
        }
        static InputEvent(e) {
            if ((e.constructor.name == "KeyboardEvent" && e.target.value.length > 0 && !(e.code == "Backspace" || e.code == "Delete"))) {
                DataInputs.CreateDataInput();
            }

            if ((e.constructor.name == "KeyboardEvent" && e.code == "Enter" && e.target.value != "")) {
                DataInputs.dataPlace.lastChild.focus();
            }

            if ((e.constructor.name == "KeyboardEvent" && e.code == "Backspace" || e.code == "Delete") && e.target.value.length == 0 && e.target.parentNode.lastChild.value == "" && parseInt(e.target.dataset.id) < DataInputs.dataPlace.children.length-1) {
                DataInputs.dataPlace.children[parseInt(e.target.dataset.id) + 1].focus();

                DataInputs.dataPlace.removeChild(e.target);
                DataInputs.ResizeDataIds();
            }
        }

        static ResizeDataIds() {
            const childs = DataInputs.dataPlace.children;
            for(var i = 0; i < childs.length; ++i) {
                childs[i].dataset.id = i;
            }
        }

        static CreateDataInput() {
            if (DataInputs.dataPlace.children.length > 1 && DataInputs.dataPlace.children[DataInputs.dataPlace.children.length - 1].value == "") {
                return;
            }

            DataInputs.dataPlace.insertAdjacentHTML("beforeEnd", this.dataTemplate);

            if (DataInputs.dataPlace.children.length > 1) {
                DataInputs.dataPlace.children[DataInputs.dataPlace.children.length - 2].removeEventListener("blur", DataInputs.InputEvent);
                DataInputs.dataPlace.lastChild.dataset.id = parseInt(DataInputs.dataPlace.children[DataInputs.dataPlace.children.length - 2].dataset.id) + 1;
            }

            DataInputs.dataPlace.lastChild.addEventListener("keyup", DataInputs.InputEvent);
            DataInputs.dataPlace.lastChild.addEventListener("blur", DataInputs.InputEvent);
        }
    }

    window.addEventListener('load', () => {
        DataInputs.CreateDataInput();
    });

    </script>
  </body>
</html>
